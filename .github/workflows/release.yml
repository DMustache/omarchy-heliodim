name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test
      - name: Build static Linux binaries
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            zig build -Drelease -Dtarget="${arch}-linux-musl"
            cmp zig-out/bin/heliodim "bin/heliodim-linux-${arch}"
            cp zig-out/bin/heliodim "dist/heliodim-linux-${arch}"
          done
          cd dist
          sha256sum heliodim-linux-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
