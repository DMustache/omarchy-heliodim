name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test
      - name: Check bundled Linux binaries
        run: |
          for arch in x86_64 aarch64; do
            zig build -Drelease -Dtarget="${arch}-linux-musl"
            cmp zig-out/bin/heliodim "bin/heliodim-linux-${arch}"
          done

  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generated art matches the pixel maps in assets/gen.py
        run: python3 -I assets/gen.py && git diff --exit-code assets widget/Art.js
